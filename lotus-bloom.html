<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awaken Creativity | Purple Lotus Bloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lotus-bloom.css">
    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>

    <div class="main-container">
        <!-- Floating Particles Layer -->
        <div id="particles-container"></div>

        <!-- Hero Section -->
        <section class="hero-section">
            <div class="lotus-wrapper">
                <!-- SVG Lotus -->
                <svg id="lotus-svg" viewBox="0 0 500 800" preserveAspectRatio="xMidYMid meet">
                    <!-- Stem -->
                    <path id="stem" d="M 250 800 Q 240 600 250 500" stroke="url(#stem-gradient)" stroke-width="8"
                        fill="none" stroke-linecap="round" />

                    <!-- Water Reflection Blur Filter -->
                    <defs>
                        <linearGradient id="stem-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#2d5a27;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0a1a08;stop-opacity:1" />
                        </linearGradient>

                        <radialGradient id="petal-gradient-inner" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#e0b1ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8a2be2;stop-opacity:1" />
                        </radialGradient>

                        <radialGradient id="petal-gradient-middle" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#bf6bff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#6a0dad;stop-opacity:1" />
                        </radialGradient>

                        <radialGradient id="petal-gradient-outer" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#a450ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4b0082;stop-opacity:1" />
                        </radialGradient>

                        <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Lotus Flower Layers -->
                    <g id="flower-container" transform="translate(250, 500)">
                        <!-- Outer Layer (6 Petals) -->
                        <g id="outer-petals" class="petal-layer">
                            <path class="petal" d="M 0 0 Q -50 -80 0 -180 Q 50 -80 0 0"
                                fill="url(#petal-gradient-outer)" transform="rotate(0)" />
                            <path class="petal" d="M 0 0 Q -50 -80 0 -180 Q 50 -80 0 0"
                                fill="url(#petal-gradient-outer)" transform="rotate(60)" />
                            <path class="petal" d="M 0 0 Q -50 -80 0 -180 Q 50 -80 0 0"
                                fill="url(#petal-gradient-outer)" transform="rotate(120)" />
                            <path class="petal" d="M 0 0 Q -50 -80 0 -180 Q 50 -80 0 0"
                                fill="url(#petal-gradient-outer)" transform="rotate(180)" />
                            <path class="petal" d="M 0 0 Q -50 -80 0 -180 Q 50 -80 0 0"
                                fill="url(#petal-gradient-outer)" transform="rotate(240)" />
                            <path class="petal" d="M 0 0 Q -50 -80 0 -180 Q 50 -80 0 0"
                                fill="url(#petal-gradient-outer)" transform="rotate(300)" />
                        </g>

                        <!-- Middle Layer (6 Petals) -->
                        <g id="middle-petals" class="petal-layer">
                            <path class="petal" d="M 0 0 Q -40 -70 0 -150 Q 40 -70 0 0"
                                fill="url(#petal-gradient-middle)" transform="rotate(30)" />
                            <path class="petal" d="M 0 0 Q -40 -70 0 -150 Q 40 -70 0 0"
                                fill="url(#petal-gradient-middle)" transform="rotate(90)" />
                            <path class="petal" d="M 0 0 Q -40 -70 0 -150 Q 40 -70 0 0"
                                fill="url(#petal-gradient-middle)" transform="rotate(150)" />
                            <path class="petal" d="M 0 0 Q -40 -70 0 -150 Q 40 -70 0 0"
                                fill="url(#petal-gradient-middle)" transform="rotate(210)" />
                            <path class="petal" d="M 0 0 Q -40 -70 0 -150 Q 40 -70 0 0"
                                fill="url(#petal-gradient-middle)" transform="rotate(270)" />
                            <path class="petal" d="M 0 0 Q -40 -70 0 -150 Q 40 -70 0 0"
                                fill="url(#petal-gradient-middle)" transform="rotate(330)" />
                        </g>

                        <!-- Inner Layer (4 Petals) -->
                        <g id="inner-petals" class="petal-layer">
                            <path class="petal" d="M 0 0 Q -30 -60 0 -120 Q 30 -60 0 0"
                                fill="url(#petal-gradient-inner)" transform="rotate(0)" />
                            <path class="petal" d="M 0 0 Q -30 -60 0 -120 Q 30 -60 0 0"
                                fill="url(#petal-gradient-inner)" transform="rotate(90)" />
                            <path class="petal" d="M 0 0 Q -30 -60 0 -120 Q 30 -60 0 0"
                                fill="url(#petal-gradient-inner)" transform="rotate(180)" />
                            <path class="petal" d="M 0 0 Q -30 -60 0 -120 Q 30 -60 0 0"
                                fill="url(#petal-gradient-inner)" transform="rotate(270)" />
                        </g>

                        <!-- Core/Center -->
                        <circle id="lotus-core" cx="0" cy="-10" r="15" fill="#ffd700" filter="url(#neon-glow)" />
                    </g>
                </svg>

                <!-- Water Ripple Effect -->
                <div class="water-ripple"></div>
            </div>

            <!-- Hero Content -->
            <div class="hero-content">
                <h1 id="headline">Awaken Creativity</h1>
                <p id="subtext">A journey that unfolds like a lotus.</p>
                <div class="glass-btn-wrapper">
                    <button class="explore-btn">Explore</button>
                </div>
            </div>
        </section>

        <!-- Dummy sections to enable scrolling -->
        <section class="scroll-tracker start">
            <div class="hint">Scroll down to bloom</div>
        </section>
        <div class="spacer"></div>
        <section class="scroll-tracker end">
            <div class="bloom-complete">Full Bloom Reached</div>
        </section>
    </div>

    <script src="lotus-bloom.js"></script>
</body>

</html>
